task: 'Context: `kind-ckaquest`


  Namespace **pss-lab** enforces the **restricted** Pod Security Standard.


  The manifest `~/ckaquest-work/48/secure-app.yaml` is rejected when you create it.


  Fix the manifest so it complies with **restricted**, then create the pod. Requirements:


  - Pod name **secure-app**, namespace **pss-lab**, image and command unchanged.

  - The pod is **Running**.

  - Do not change the labels of namespace **pss-lab**.

