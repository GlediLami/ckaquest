# Same pod plus a toleration that matches the taint on node01.
apiVersion: v1
kind: Pod
metadata:
  name: regular-app
  namespace: taints-tolerations
spec:
  nodeSelector:
    kubernetes.io/hostname: ckaquest-worker
  containers:
  - name: app
    image: nginx:1.27
  tolerations:
  - key: dedicated
    operator: Equal
    value: gpu
    effect: NoSchedule
