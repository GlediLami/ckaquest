description: |
  Your application pods won't schedule! Nodes are tainted for dedicated workloads.
  
  All nodes have a taint "dedicated=gpu:NoSchedule" to reserve them for GPU workloads.
  Your regular application doesn't have the matching toleration.
  
  Error: "0/3 nodes are available: 3 node(s) had untolerated taint"
  
  Your mission: Add tolerations to allow scheduling on tainted nodes.

learning_objectives:
  - Understand taints and tolerations
  - Configure tolerations correctly
  - Differentiate NoSchedule, PreferNoSchedule, NoExecute
  - Debug taint-related scheduling failures
domain: workloads
course_section: 3
docs:
  - https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
task: |
  Context: `kind-ckaquest`

  Node **node01** carries the taint `dedicated=gpu:NoSchedule`. Pod **regular-app** in namespace **taints-tolerations** must run on node01 but stays Pending.
  Add a toleration so the pod runs on node01. Do not remove the taint or the pod's nodeSelector.
namespace: taints-tolerations
exam: true
