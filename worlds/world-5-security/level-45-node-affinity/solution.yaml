# SOLUTION: NodeAffinity with correct labels

# First, label a node for GPU workloads
# kubectl label nodes ckaquest-worker accelerator=gpu   # node01 (setup already did this)

apiVersion: v1
kind: Pod
metadata:
  name: gpu-workload
  namespace: node-affinity
spec:
  containers:
  - name: ml-training
    image: nginx:1.27
    command: ['sh', '-c', 'echo "✅ GPU workload scheduled successfully on node: $MY_NODE_NAME"; sleep 3600']
    env:
    - name: MY_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  affinity:
    nodeAffinity:
      # ✅ REQUIRED: Must match or pod won't schedule
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: accelerator  # ✅ Correct key
            operator: In
            values:
            - gpu  # ✅ Correct value
      # ✅ PREFERRED: Nice to have, but not required  
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
          - key: kubernetes.io/hostname
            operator: In
            values:
            - ckaquest-worker

# This configuration:
# 1. REQUIRES node with label accelerator=gpu
# 2. PREFERS node01 (ckaquest-worker, weight 100)
# 3. Will schedule to any node with accelerator=gpu if node01 is unavailable
#
# The pod now schedules successfully!
