level: 49
title: "PriorityClass: Preemption"
objective: "Fix the broken resources and make the validation pass"
name: "PriorityClass: Preemption"
difficulty: advanced
xp: 300
xp_reward: 300
world: 5
concepts:
  - priorityclass
  - preemption
  - scheduling-priority
  - eviction
description: |
  Critical production pods can't schedule! Node resources are full.
  
  Lower-priority development pods are consuming all resources.
  Your critical API pods need to preempt them to ensure service availability.
  
  Error: "0/3 nodes are available: 3 Insufficient cpu"
  
  Your mission: Create PriorityClass and assign to critical pods for preemption.

learning_objectives:
  - Understand PriorityClass and pod priority
  - Configure preemption for critical workloads
  - Balance resource allocation by priority
  - Debug priority-based scheduling
domain: workloads
course_section: 3
docs:
  - https://kubernetes.io/docs/concepts/scheduling-eviction/pod-priority-preemption/
task: |
  Context: `kind-ckaquest`

  Pod **critical-api** in namespace **ckaquest** must win against dev workloads when the cluster is full.
  Create PriorityClass **high-priority** (value 1000) and PriorityClass **low-priority** (value 100). Run critical-api with high-priority and **dev-workload-1** with low-priority.
