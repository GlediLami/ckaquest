description: |
  🚨 PRODUCTION EMERGENCY! Multiple simultaneous failures! 🚨
  
  The production cluster is experiencing a cascade of issues:
  
  1. 🔐 RBAC: App can't access Kubernetes API (Permission denied)
  2. 🛡️  SecurityContext: Running as root, violating security policy
  3. 💰 ResourceQuota: Exceeding namespace CPU quota
  4. 🔒 NetworkPolicy: Database unreachable, network blocked
  5. 📍 Node Affinity: Can't schedule on required node pool
  6. ⚡ Taints: Nodes tainted, pods have no tolerations
  7. 🛡️  PDB: Blocking necessary maintenance
  8. 🔐 Pod Security: Violating restricted standard
  9. ⭐ Priority: Critical pods stuck behind low-priority workloads
  
  Your mission: Fix ALL issues simultaneously. This is the ultimate test!

learning_objectives:
  - Apply all World 5 concepts together
  - Debug complex multi-layered failures
  - Think holistically about Kubernetes security and operations
  - Demonstrate production-ready expertise
domain: troubleshooting
course_section: 14
docs:
  - https://kubernetes.io/docs/reference/access-authn-authz/rbac/
  - https://kubernetes.io/docs/concepts/policy/resource-quotas/
  - https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
task: |
  Context: `kind-ckaquest`

  Namespace **ckaquest** has many failures at the same time: the app does not start, cannot be reached and cannot be maintained.
  Inspect Deployment **chaos-app** and everything around it: ResourceQuota **chaos-quota**, ServiceAccount **app-sa** and its RBAC, NetworkPolicies, PDB **chaos-pdb**, securityContext and PriorityClass **production-priority**.
  Fix every problem until all replicas of chaos-app are ready. Run `validate` often. It tells you how many checks pass.
