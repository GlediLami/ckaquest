name: "Secret Encoding vs Encryption"
description: "database-client crashes with 'Invalid username format'"
objective: "Fix the Secret so the client gets the right credentials"
xp: 250
difficulty: intermediate
expected_time: 8m
domain: storage
namespace: secret-encoding
exam: true
concepts:
  - secrets
  - base64 encoding
  - environment variables from secrets
task: |
  Context: `kind-ckaquest`

  Pod **database-client** in namespace **secret-encoding** reads its credentials from Secret **db-credentials**.
  The pod keeps crashing with `Invalid username format`.

  The real credentials are username `admin` and password `secretpass123`.
  Fix the Secret and make sure database-client is running and logs `Connected successfully`.
docs:
  - https://kubernetes.io/docs/concepts/configuration/secret/
  - https://kubernetes.io/docs/tasks/configmap-secret/managing-secret-using-kubectl/
course_section: 5
