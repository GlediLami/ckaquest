level: 40
title: "EmptyDir Lost on Restart"
objective: "Fix the broken resources and make the validation pass"
name: "EmptyDir Lost on Restart"
world: "Storage & Stateful Apps"
difficulty: "intermediate"
xp: 250
concepts:
  - emptydir
  - ephemeral-storage
  - persistent-storage
  - volume-lifecycle
description: |
  Data keeps disappearing when pods restart! The application is using an emptyDir
  volume, which is ephemeral and gets wiped on pod restart. For persistent data,
  we need a PersistentVolumeClaim instead!
  
learning_objectives:
  - Understand emptyDir vs PVC differences
  - Learn when to use ephemeral vs persistent storage
  - Recognize data persistence requirements
  - Choose appropriate volume types
domain: storage
course_section: 8
docs:
  - https://kubernetes.io/docs/concepts/storage/volumes/#emptydir
task: |
  Context: `kind-ckaquest`

  Pod **data-app** in namespace **ckaquest** stores data in an `emptyDir`. The data is lost every time the pod is recreated.
  Create PVC **app-data** (1Gi, ReadWriteOnce) and change the pod to use it in place of the emptyDir.
