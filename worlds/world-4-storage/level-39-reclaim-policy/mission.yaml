level: 39
title: "Reclaim Policy Data Loss"
objective: "Fix the broken resources and make the validation pass"
name: "Reclaim Policy Data Loss"
world: "Storage & Stateful Apps"
difficulty: "intermediate"
xp: 250
concepts:
  - reclaim-policy
  - persistent-volume
  - data-retention
  - delete-vs-retain
description: |
  Important data was lost when a PVC was deleted! The PV had a "Delete" reclaim
  policy, so when the claim was removed, all the data was wiped. For production
  data, we need a safer policy!
  
learning_objectives:
  - Understand PV reclaim policies
  - Learn difference between Delete and Retain
  - Prevent accidental data loss
  - Configure appropriate retention policies
domain: storage
course_section: 8
docs:
  - https://kubernetes.io/docs/concepts/storage/persistent-volumes/#reclaiming
task: |
  Context: `kind-ckaquest`

  PV **important-data** holds data that must survive even if PVC **data-claim** in namespace **ckaquest** is deleted.
  Change the PV so its data is kept when the claim is released. Pod **data-writer** must keep running.
