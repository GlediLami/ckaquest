description: |
  A pod is crashing with "Permission denied" errors when trying to write to
  its mounted volume. The filesystem permissions don't match the user the
  container is running as!
  
learning_objectives:
  - Understand volume ownership and permissions
  - Learn to configure fsGroup and runAsUser
  - Debug permission issues in containers
  - Properly configure security contexts
domain: storage
course_section: 8
docs:
  - https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
task: |
  Context: `kind-ckaquest`

  Pod **writer-app** in namespace **volume-permissions** runs as user 1000 and fails to write to its volume from PVC **app-data**.
  Fix the pod with a securityContext so the volume is writable by the pod's group. Do not run the container as root.
namespace: volume-permissions
