name: "Namespace Confusion"
description: "Resources deployed to wrong namespace, causing connectivity failures"
objective: "Move the resources to the correct namespace"
xp: 200
difficulty: intermediate
expected_time: 15m
concepts:
  - Namespaces
  - Resource isolation
  - kubectl namespaces
  - Cross-namespace communication
  - Namespace best practices
domain: workloads
course_section: 2
docs:
  - https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/
task: |
  Context: `kind-ckaquest`

  Pod **client-app** and Service **backend-service** belong in namespace **team-a**, but they were created somewhere else.
  Move both into **team-a**. Nothing of them may remain in the wrong namespace.
namespace: team-a
