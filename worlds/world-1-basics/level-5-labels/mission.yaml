name: "Lost Connection - Labels & Selectors"
description: "A Service can't find its pods because the label selector doesn't match"
objective: "Fix either the Service selector or Pod labels so traffic can reach the pod"
xp: 150
difficulty: beginner
expected_time: 15m
concepts:
  - Labels
  - Selectors
  - Services
  - kubectl get with label filters
  - Service endpoints
  - Pod connectivity
domain: networking
course_section: 2
docs:
  - https://kubernetes.io/docs/concepts/services-networking/service/
  - https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
task: |
  Context: `kind-ckaquest`

  Service **backend-service** in namespace **ckaquest** has no endpoints, so it sends traffic nowhere.
  Fix it so the service routes to pod **backend-app**.
