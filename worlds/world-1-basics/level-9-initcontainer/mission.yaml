name: "Init Container Gridlock"
description: "Pod stuck in Init state because the init container never completes"
objective: "Fix the init container so the main container can start"
xp: 200
difficulty: intermediate
expected_time: 15m
concepts:
  - Init containers
  - Pod initialization
  - Container dependencies
  - kubectl describe
  - Init container debugging
domain: workloads
course_section: 5
docs:
  - https://kubernetes.io/docs/concepts/workloads/pods/init-containers/
task: |
  Context: `kind-ckaquest`

  Pod **web-with-init** in namespace **initcontainer** is stuck in `Init`.
  Find what the init container waits for and fix it, so the nginx container starts.
namespace: initcontainer
