apiVersion: v1
kind: Pod
metadata:
  name: web-with-init
  namespace: initcontainer
spec:
  initContainers:
  - name: wait-for-service
    image: busybox:1.36
    # ❌ Waits for a service that doesn't exist - will never complete!
    command: ['sh', '-c', 'until nslookup backend-service.initcontainer.svc.cluster.local; do echo waiting; sleep 2; done']
  containers:
  - name: web
    image: nginx:1.27
    ports:
    - containerPort: 80
