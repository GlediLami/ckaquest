name: "Sidecar Sabotage"
description: "A multi-container pod where the sidecar container keeps crashing"
objective: "Fix the sidecar container so the entire pod can run successfully"
xp: 200
difficulty: intermediate
expected_time: 15m
concepts:
  - Multi-container pods
  - Sidecar pattern
  - Container dependencies
  - kubectl logs with container selection
  - Pod lifecycle
domain: workloads
course_section: 5
docs:
  - https://kubernetes.io/docs/concepts/workloads/pods/sidecar-containers/
task: |
  Context: `kind-ckaquest`

  Pod **app-with-logging** in namespace **multicontainer** has a main container and a logging sidecar. The pod never becomes fully ready.
  Find the failing container and fix it. Both containers must be running.
namespace: multicontainer
exam: true
