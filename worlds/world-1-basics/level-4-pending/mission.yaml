name: "Pending Pod Problem"
description: "A pod is stuck in Pending status because it's asking for more resources than available"
objective: "Adjust the resource requests so the pod can be scheduled"
xp: 150
difficulty: beginner
expected_time: 12m
concepts:
  - Pod scheduling
  - Resource requests
  - Resource limits
  - kubectl describe
  - Pending status
  - Node capacity
domain: workloads
course_section: 3
docs:
  - https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
task: |
  Context: `kind-ckaquest`

  Pod **hungry-app** in namespace **pending** stays Pending.
  Find out why the scheduler cannot place it. Change the pod so it is scheduled and Running. Do not remove the resource requests.
namespace: pending
exam: true
