name: "Port Mismatch Mayhem"
description: "Service is forwarding to the wrong container port, causing connection failures"
objective: "Fix the port configuration so the service can reach the container"
xp: 100
difficulty: beginner
expected_time: 10m
concepts:
  - Container ports
  - Service ports vs targetPorts
  - Port mapping
  - kubectl port-forward
  - Debugging connectivity
domain: networking
course_section: 2
docs:
  - https://kubernetes.io/docs/concepts/services-networking/service/
task: |
  Context: `kind-ckaquest`

  Service **web-service** in namespace **ports** should forward to pod **web-server** (nginx), but requests to it fail.
  Fix the port configuration so the service reaches nginx.
namespace: ports
exam: true
