name: "Admission Control"
description: "The team wants namespaces to be created automatically"
objective: "Enable an admission plugin on the API server"
xp: 300
difficulty: advanced
expected_time: 10m
domain: architecture
course_section: 3
namespace: admission-lab
exam: true
concepts:
  - admission controllers
  - kube-apiserver flags
  - --enable-admission-plugins
task: |
  Context: `kind-ckaquest`

  Enable the admission plugin **NamespaceAutoProvision** on the kube-apiserver. Keep the plugins that are already enabled.

  Then create pod **probe** (image `busybox:1.36`, command `sleep 3600`) in namespace **auto-created**, without creating the namespace first.
docs:
  - https://kubernetes.io/docs/reference/access-authn-authz/admission-controllers/
  - https://kubernetes.io/docs/reference/command-line-tools-reference/kube-apiserver/
