name: "Service Selector Mismatch"
description: "A service exists but pods aren't receiving traffic"
objective: "Fix the service so it routes traffic to the backend pods"
xp: 200
difficulty: "intermediate"
expected_time: "15m"
concepts:
  - services
  - label selectors
  - service endpoints
  - kubectl describe svc
  - ClusterIP
domain: networking
course_section: 2
docs:
  - https://kubernetes.io/docs/concepts/services-networking/service/
task: |
  Context: `kind-ckaquest`

  Service **backend-service** in namespace **ckaquest** gets no traffic to pod **backend-pod**. Pod **test-client** cannot reach it.
  Fix the Service so it routes to backend-pod. Do not change the pod.
