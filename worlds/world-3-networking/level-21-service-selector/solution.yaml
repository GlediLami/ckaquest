apiVersion: v1
kind: Pod
metadata:
  name: backend-pod
  namespace: service-selector
  labels:
    app: backend
    tier: api
spec:
  containers:
  - name: nginx
    image: nginx:1.21
    ports:
    - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: service-selector
spec:
  selector:
    app: backend  # ✅ FIXED! Matches pod label
    tier: api
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: ClusterIP
---
# Test pod to verify connectivity
apiVersion: v1
kind: Pod
metadata:
  name: test-client
  namespace: service-selector
spec:
  containers:
  - name: curl
    image: curlimages/curl:8.11.1
    command: ["sleep", "3600"]
