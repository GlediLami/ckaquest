name: "Scale Down Slowly"
description: "The API flaps between replica counts every minute"
objective: "Create an HPA with a scale-down stabilization window"
xp: 300
difficulty: intermediate
expected_time: 8m
domain: workloads
course_section: 5
namespace: hpa-lab
exam: true
concepts:
  - HorizontalPodAutoscaler
  - autoscaling/v2
  - behavior
  - stabilizationWindowSeconds
task: |
  Context: `kind-ckaquest`

  Create an HPA **api** in namespace **hpa-lab** for Deployment **api**:
  - min **2**, max **6** replicas
  - target average CPU utilization **60%**
  - scale down: stabilization window of **300** seconds, and remove at most **1** pod per **60** seconds
docs:
  - https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/#configurable-scaling-behavior
