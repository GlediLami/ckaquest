name: "Every Node, Really Every Node"
description: "The node agent must also run on the control plane"
objective: "Create a DaemonSet that runs on all nodes"
xp: 250
difficulty: intermediate
expected_time: 6m
domain: workloads
course_section: 3
namespace: agent-lab
exam: true
concepts:
  - DaemonSet
  - tolerations
  - control-plane taint
task: |
  Context: `kind-ckaquest`

  Create DaemonSet **node-agent** in namespace **agent-lab** with image `busybox:1.36`, command `sleep 3600`, label `app=node-agent`.

  It must run one pod on **every** node, including the control plane. Requests: CPU 10m, memory 16Mi.
docs:
  - https://kubernetes.io/docs/concepts/workloads/controllers/daemonset/
