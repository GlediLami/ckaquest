name: "Traffic to Unready Pods"
description: "Pods receive traffic before they're ready, causing 502 errors for users"
objective: "Add a readiness probe to prevent traffic from hitting pods too early"
xp: 200
difficulty: intermediate
expected_time: 15m
concepts:
  - readiness probes
  - service endpoints
  - traffic routing
  - pod startup
  - HTTP probes
  - liveness vs readiness
domain: workloads
course_section: 5
docs:
  - https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
task: |
  Context: `kind-ckaquest`

  Service **slow-app-service** in namespace **readiness** sends traffic to pods of Deployment **slow-startup-app** before they can serve it.
  Add a readiness probe to the container: HTTP GET on path `/`, port 80. All replicas must become ready.
namespace: readiness
