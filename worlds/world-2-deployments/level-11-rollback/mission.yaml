name: "Deployment Update Stuck"
description: "A rolling update has failed because the new container image doesn't exist"
objective: "Rollback the deployment to the previous working version"
xp: 200
difficulty: intermediate
expected_time: 15m
concepts:
  - deployments
  - rolling updates
  - rollback
  - kubectl rollout
  - deployment history
  - image versioning
domain: workloads
course_section: 5
docs:
  - https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#rolling-back-a-deployment
task: |
  Context: `kind-ckaquest`

  Deployment **web-app** in namespace **rollback** was just updated and the new pods do not start.
  Roll the Deployment back to the previous revision. All replicas must be ready again.
namespace: rollback
