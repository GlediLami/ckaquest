name: "Stateful App Data Loss"
description: "Using Deployment for a database causes data loss and pod identity issues"
objective: "Convert the Deployment to a StatefulSet to provide stable pod identities and persistent storage"
xp: 200
difficulty: advanced
expected_time: 18m
concepts:
  - StatefulSet
  - vs Deployment
  - persistent storage
  - pod identity
  - stable network IDs
  - headless services
  - stateful workloads
domain: workloads
course_section: 5
docs:
  - https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/
task: |
  Context: `kind-ckaquest`

  The database in namespace **statefulset** runs as Deployment **database**. Its pods need stable names.
  Replace it with a StatefulSet **database**, 3 replicas, same image and labels, using the existing Service **database-service** as its serviceName. Delete the Deployment.
namespace: statefulset
exam: true
