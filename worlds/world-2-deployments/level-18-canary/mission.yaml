name: "Canary Weight Imbalance"
description: "Canary deployment has wrong replica ratios, making testing inaccurate"
objective: "Fix the replica counts to achieve proper 90/10 traffic split for canary testing"
xp: 200
difficulty: intermediate
expected_time: 12m
concepts:
  - canary deployments
  - traffic splitting
  - replica ratios
  - gradual rollouts
  - A/B testing
  - deployment patterns
domain: workloads
course_section: 5
docs:
  - https://kubernetes.io/docs/concepts/workloads/management/#canary-deployments
task: |
  Context: `kind-ckaquest`

  Deployments **app-stable** and **app-canary** in namespace **ckaquest** sit behind the same Service **app-service**. The canary should get about 10% of the pods.
  Scale them so there are 10 pods in total: 9 stable and 1 canary.
