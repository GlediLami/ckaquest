name: "Blue-Green Gone Wrong"
description: "Service is pointing to the old version, users don't see the new deployment"
objective: "Update the service selector to route traffic to the new blue-green deployment"
xp: 200
difficulty: intermediate
expected_time: 12m
concepts:
  - blue-green deployments
  - service selectors
  - labels
  - traffic switching
  - deployment strategies
  - zero-downtime switchover
domain: workloads
course_section: 5
docs:
  - https://kubernetes.io/docs/concepts/services-networking/service/
task: |
  Context: `kind-ckaquest`

  Namespace **bluegreen** runs two versions of an app: Deployments **app-blue** (old) and **app-green** (new).
  Switch Service **app-service** so it sends all traffic to the green pods and none to blue.
namespace: bluegreen
